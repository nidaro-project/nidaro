services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nidaro
      POSTGRES_USER: nidaro
      POSTGRES_PASSWORD: nidaro
    ports:
      - "5432:5432"
    volumes:
      - nidaro-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - nidaro-redis:/data

volumes:
  nidaro-postgres:
  nidaro-redis:
