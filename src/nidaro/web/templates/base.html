{% import "components/icons.html" as icons %}<!doctype html>
<html lang="en" data-theme="daylight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}nidaro{% endblock %}</title>
  <script>(function(){try{var t=localStorage.getItem("nidaro-theme");if(t){document.documentElement.dataset.theme=t;}}catch(e){}})();</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f5c2f'/%3E%3Cpath fill='%23ffffff' d='M18.6 5.4C11.6 4.9 7.1 8.3 6.1 12.9c-.3 1.5-.1 2.9.4 4.1.1.3.5.4.8.3.8-.4 1.7-.6 2.7-.7 4.7-.4 8.2-4.4 8.6-11.2Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="logo" href="/">
        <span class="logo__mark">{{ icons.leaf() }}</span>
        <span class="logo__word">nidaro</span>
      </a>
      <nav class="nav" aria-label="Main">
        {% for item in nav %}
        <a class="nav__link" href="{{ item.href }}"{% if item.active %} aria-current="page"{% endif %}>
          {{ icons.icon(item.icon) }}<span>{{ item.label }}</span>
        </a>
        {% endfor %}
      </nav>
      <div class="sidebar__spacer"></div>
      <section class="family-card">
        <div class="family-card__head">The Morgan Family {{ icons.chevron_down() }}</div>
        <div class="avatar-stack">
          <span class="avatar avatar--0"></span>
          <span class="avatar avatar--1"></span>
          <span class="avatar avatar--2"></span>
          <span class="avatar avatar--3"></span>
        </div>
        <button class="btn btn--dashed">{{ icons.plus() }} Invite a member</button>
      </section>
    </aside>
    <div class="main">
      <header class="topbar">
        <label class="search">
          {{ icons.search() }}
          <input type="search" placeholder="Search meals, events, tasks, people…">
          <span class="kbd">⌘K</span>
        </label>
        <div class="topbar__spacer"></div>
        <button class="btn btn--ghost">{{ icons.sparkle() }} Ask nidaro</button>
        <button class="icon-btn" aria-label="Notifications">{{ icons.bell() }}<span class="icon-btn__dot"></span></button>
        <button class="topbar__account" aria-label="Account">
          <span class="avatar avatar--sm avatar--0"></span>
          {{ icons.chevron_down() }}
        </button>
      </header>
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
</body>
</html>
