{% extends "base.html" %}
{% import "components/icons.html" as icons %}
{# Family calendar: month wall grid, week and day agenda. State lives in the URL. #}
{% block title %}Calendar · nidaro{% endblock %}
{% block content %}
<link rel="stylesheet" href="/static/css/calendar.css">
{% include "calendar_main.html" %}

<script>
  (function () {
    try {
      var requested = new URLSearchParams(location.search).get("view");
      if (requested === "month" || requested === "week" || requested === "day") {
        localStorage.setItem("nidaro-calendar-view", requested);
        return;
      }
      var stored = localStorage.getItem("nidaro-calendar-view");
      if ((stored === "month" || stored === "week" || stored === "day") && stored !== "{{ view }}") {
        location.replace("/calendar?view=" + stored);
      }
    } catch (e) {}
  })();
</script>
{% endblock %}
