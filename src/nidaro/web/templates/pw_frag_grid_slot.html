{# PROTOTYPE — fragment: one grid cell (day × slot). HTMX replaces it on add/remove. #}
{% import "components/icons.html" as icons %}
<div class="pw-cell{% if day.is_today %} pw-cell--today{% endif %}" id="pw-cell-{{ day.iso }}-{{ slot }}">
  {% for e in day.entries[slot] %}
  <span class="pw-chip{% if not e.dish_id %} pw-chip--oneoff{% endif %}">
    <span class="pw-chip__name">{{ e.name }}</span>
    <form class="pw-xform" hx-post="/prototype/week-view/entries/delete"
          hx-target="#pw-cell-{{ day.iso }}-{{ slot }}" hx-swap="outerHTML">
      <input type="hidden" name="variant" value="{{ variant }}">
      <input type="hidden" name="w" value="{{ w }}">
      <input type="hidden" name="on" value="{{ day.iso }}">
      <input type="hidden" name="slot" value="{{ slot }}">
      <input type="hidden" name="entry_id" value="{{ e.id }}">
      <button class="pw-x" aria-label="Remove {{ e.name }}">✕</button>
    </form>
  </span>
  {% endfor %}
  <details class="pw-add">
    <summary aria-label="Add {{ slot }} for {{ day.weekday }} {{ day.day_num }}">{{ icons.plus() }}</summary>
    <form hx-post="/prototype/week-view/entries"
          hx-target="#pw-cell-{{ day.iso }}-{{ slot }}" hx-swap="outerHTML">
      <input type="hidden" name="variant" value="{{ variant }}">
      <input type="hidden" name="w" value="{{ w }}">
      <input type="hidden" name="on" value="{{ day.iso }}">
      <input type="hidden" name="slot" value="{{ slot }}">
      <select name="dish_id">
        <option value="">One-off…</option>
        {% for d in dishes %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}
      </select>
      <input name="name" placeholder="or type a name" autocomplete="off">
      <button class="btn btn--primary pw-addbtn">Add</button>
    </form>
  </details>
</div>
