[project]
name = "nidaro"
version = "0.1.0"
description = "An open-source family operating assistant."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
authors = [{ name = "Nidaro contributors" }]
dependencies = [
  "alembic>=1.16,<2",
  "chrome-agent>=0.5.8,<0.6",
  "cryptography>=44,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1.6",
  "logfire[fastapi,sqlalchemy]>=4,<5",
  "opentelemetry-api>=1.41,<1.42",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-ai>=2,<3",
  "pydantic-deep>=0.3.43,<0.4",
  "pydantic-settings>=2.10,<3",
  "redis>=7,<9",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "taskiq>=0.11,<1",
  "taskiq-redis>=1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
]

[project.scripts]
nidaro-seed = "nidaro.seed:main"
nidaro-rotate-credentials = "nidaro.rotate:main"
nidaro-chromium-supervisor = "nidaro.chromium.cli:main"

[tool.pytest.ini_options]
markers = [
  "integration: tests that need PostgreSQL or Redis infrastructure",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nidaro"]

# deptry treats the project's own package (src/nidaro layout) as an undeclared
# third-party dependency, which floods DEP001 with self-import false positives
# (155 on main). Declaring it first-party keeps DEP001 armed for genuinely
# missing third-party imports while silencing only those false positives.
[tool.deptry]
known_first_party = ["nidaro"]
