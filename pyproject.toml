[project]
name = "nidaro"
version = "0.1.0"
description = "An open-source family operating assistant."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
authors = [{ name = "Nidaro contributors" }]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "logfire[fastapi,sqlalchemy]>=4,<5",
  "opentelemetry-api>=1.41,<1.42",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-ai>=2,<3",
  "pydantic-deep>=0.3.43,<0.4",
  "pydantic-settings>=2.10,<3",
  "redis>=7,<9",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "taskiq>=0.11,<1",
  "taskiq-redis>=1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<7",
]

[project.scripts]
nidaro-seed = "nidaro.seed:main"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=nidaro --cov-report=term-missing"
markers = ["integration: requires PostgreSQL and Redis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nidaro"]
